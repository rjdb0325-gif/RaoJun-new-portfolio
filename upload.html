<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件上传管理 | 饶俊作品集</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .upload-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 20px 60px;
        }

        .upload-container {
            max-width: 800px;
            width: 100%;
            background-color: var(--gray-color);
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .upload-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .upload-header h1 {
            font-size: 2.5rem;
            font-weight: 300;
            color: var(--secondary-color);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .upload-header p {
            color: var(--text-color);
            font-size: 1rem;
        }

        .upload-area {
            border: 2px dashed var(--primary-color);
            border-radius: 10px;
            padding: 60px 40px;
            text-align: center;
            background-color: rgba(78, 205, 196, 0.05);
            transition: var(--transition);
            cursor: pointer;
            margin-bottom: 30px;
        }

        .upload-area:hover {
            background-color: rgba(78, 205, 196, 0.1);
            border-color: var(--secondary-color);
        }

        .upload-area.dragover {
            background-color: rgba(78, 205, 196, 0.15);
            border-color: var(--secondary-color);
            transform: scale(1.02);
        }

        .upload-icon {
            margin-bottom: 20px;
        }

        .upload-area h3 {
            font-size: 1.3rem;
            color: var(--secondary-color);
            margin-bottom: 10px;
            font-weight: 500;
        }

        .upload-area p {
            color: var(--text-color);
            font-size: 0.95rem;
        }

        .upload-area .file-types {
            color: var(--primary-color);
            font-size: 0.85rem;
            margin-top: 10px;
        }

        #fileInput {
            display: none;
        }

        .file-list {
            margin-bottom: 30px;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--light-color);
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .file-icon {
            width: 40px;
            height: 40px;
            background-color: var(--primary-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .file-icon svg {
            width: 24px;
            height: 24px;
        }

        .file-details h4 {
            font-size: 1rem;
            color: var(--secondary-color);
            margin-bottom: 3px;
        }

        .file-details p {
            font-size: 0.85rem;
            color: var(--text-color);
        }

        .file-actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 0.85rem;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-copy {
            background-color: var(--primary-color);
            color: var(--light-color);
        }

        .btn-copy:hover {
            background-color: #3dbdb5;
        }

        .btn-delete {
            background-color: #ff6b6b;
            color: var(--light-color);
        }

        .btn-delete:hover {
            background-color: #ff5252;
        }

        .upload-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .upload-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .link-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .link-modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--light-color);
            padding: 40px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        .modal-content h3 {
            font-size: 1.5rem;
            color: var(--secondary-color);
            margin-bottom: 20px;
        }

        .link-box {
            background-color: var(--gray-color);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            word-break: break-all;
            font-family: monospace;
            font-size: 0.9rem;
            color: var(--secondary-color);
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .uploaded-files-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
        }

        .uploaded-files-section h2 {
            font-size: 1.5rem;
            color: var(--secondary-color);
            margin-bottom: 20px;
            font-weight: 500;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-color);
        }

        .empty-state svg {
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background-color: rgba(78, 205, 196, 0.2);
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary-color);
            border-radius: 2px;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-logo">
                <h1>饶俊</h1>
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">首页</a>
                <a href="index.html#projects" class="nav-link">作品</a>
                <a href="index.html#about" class="nav-link">关于我</a>
                <a href="index.html#contact" class="nav-link">联系</a>
                <a href="upload.html" class="nav-link active">上传</a>
            </div>
        </div>
    </nav>

    <main>
        <section class="upload-section">
            <div class="upload-container">
                <div class="upload-header">
                    <h1>文件上传</h1>
                    <p>上传PDF文件，自动生成下载链接</p>
                </div>

                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">
                        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M21 15V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V15" stroke="#4ECDC4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M17 8L12 3L7 8" stroke="#4ECDC4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M12 3V15" stroke="#4ECDC4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <h3>点击或拖拽文件到此处</h3>
                    <p>支持上传 PDF 文件</p>
                    <p class="file-types">文件大小限制：50MB</p>
                </div>

                <input type="file" id="fileInput" accept=".pdf" multiple>

                <div class="file-list" id="fileList"></div>

                <button class="btn btn-primary upload-btn" id="uploadBtn" disabled>
                    开始上传
                </button>

                <div class="uploaded-files-section">
                    <h2>已上传文件</h2>
                    <div id="uploadedFiles">
                        <div class="empty-state">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M14 2H6C4.9 2 4 2.9 4 4V20C4 21.1 4.9 22 6 22H18C19.1 22 20 21.1 20 20V8L14 2Z" stroke="#292F36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M14 2V8H20" stroke="#292F36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M12 18V12" stroke="#292F36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M9 15L12 12L15 15" stroke="#292F36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            <p>暂无已上传文件</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div class="link-modal" id="linkModal">
        <div class="modal-content">
            <h3>下载链接已生成</h3>
            <div class="link-box" id="linkBox"></div>
            <div class="modal-buttons">
                <button class="btn btn-primary btn-copy" id="copyBtn">复制链接</button>
                <button class="btn btn-secondary" id="closeBtn">关闭</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 饶俊 - Product Manager</p>
        </div>
    </footer>

    <script>
        // 文件上传管理
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const uploadBtn = document.getElementById('uploadBtn');
        const uploadedFiles = document.getElementById('uploadedFiles');
        const linkModal = document.getElementById('linkModal');
        const linkBox = document.getElementById('linkBox');
        const copyBtn = document.getElementById('copyBtn');
        const closeBtn = document.getElementById('closeBtn');

        let selectedFiles = [];
        let uploadedFilesList = JSON.parse(localStorage.getItem('uploadedFiles') || '[]');

        // 初始化显示已上传文件
        displayUploadedFiles();

        // 点击上传区域
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // 拖拽事件
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = Array.from(e.dataTransfer.files).filter(file => file.type === 'application/pdf');
            handleFiles(files);
        });

        // 文件选择
        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            handleFiles(files);
        });

        // 处理文件
        function handleFiles(files) {
            files.forEach(file => {
                if (file.size > 50 * 1024 * 1024) {
                    alert(`文件 ${file.name} 超过50MB限制`);
                    return;
                }
                if (!selectedFiles.find(f => f.name === file.name)) {
                    selectedFiles.push(file);
                }
            });
            displayFileList();
        }

        // 显示文件列表
        function displayFileList() {
            fileList.innerHTML = selectedFiles.map((file, index) => `
                <div class="file-item">
                    <div class="file-info">
                        <div class="file-icon">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M14 2H6C4.9 2 4 2.9 4 4V20C4 21.1 4.9 22 6 22H18C19.1 22 20 21.1 20 20V8L14 2Z" fill="white"/>
                                <path d="M14 2V8H20" stroke="#4ECDC4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M16 13H8" stroke="#4ECDC4" stroke-width="2" stroke-linecap="round"/>
                                <path d="M16 17H8" stroke="#4ECDC4" stroke-width="2" stroke-linecap="round"/>
                                <path d="M10 9H8" stroke="#4ECDC4" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <div class="file-details">
                            <h4>${file.name}</h4>
                            <p>${formatFileSize(file.size)}</p>
                        </div>
                    </div>
                    <button class="btn-small btn-delete" onclick="removeFile(${index})">删除</button>
                </div>
            `).join('');

            uploadBtn.disabled = selectedFiles.length === 0;
            uploadBtn.textContent = selectedFiles.length > 0 ? `上传 ${selectedFiles.length} 个文件` : '开始上传';
        }

        // 移除文件
        function removeFile(index) {
            selectedFiles.splice(index, 1);
            displayFileList();
        }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 上传文件
        uploadBtn.addEventListener('click', async () => {
            if (selectedFiles.length === 0) return;

            uploadBtn.disabled = true;
            uploadBtn.textContent = '上传中...';

            for (const file of selectedFiles) {
                try {
                    const fileData = await readFile(file);
                    const fileId = generateFileId();
                    const fileInfo = {
                        id: fileId,
                        name: file.name,
                        size: file.size,
                        uploadTime: new Date().toISOString(),
                        data: fileData
                    };

                    // 保存到本地存储
                    uploadedFilesList.push(fileInfo);
                    localStorage.setItem('uploadedFiles', JSON.stringify(uploadedFilesList));

                    // 生成下载链接
                    const downloadLink = `${window.location.origin}/download.html?id=${fileId}`;
                    showLinkModal(downloadLink);
                } catch (error) {
                    console.error('上传失败:', error);
                    alert(`文件 ${file.name} 上传失败`);
                }
            }

            selectedFiles = [];
            displayFileList();
            displayUploadedFiles();
            uploadBtn.disabled = false;
            uploadBtn.textContent = '开始上传';
        });

        // 读取文件
        function readFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // 生成文件ID
        function generateFileId() {
            return 'file_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        // 显示链接弹窗
        function showLinkModal(link) {
            linkBox.textContent = link;
            linkModal.classList.add('active');
        }

        // 复制链接
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(linkBox.textContent).then(() => {
                copyBtn.textContent = '已复制';
                setTimeout(() => {
                    copyBtn.textContent = '复制链接';
                }, 2000);
            });
        });

        // 关闭弹窗
        closeBtn.addEventListener('click', () => {
            linkModal.classList.remove('active');
        });

        // 显示已上传文件
        function displayUploadedFiles() {
            if (uploadedFilesList.length === 0) {
                uploadedFiles.innerHTML = `
                    <div class="empty-state">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M14 2H6C4.9 2 4 2.9 4 4V20C4 21.1 4.9 22 6 22H18C19.1 22 20 21.1 20 20V8L14 2Z" stroke="#292F36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M14 2V8H20" stroke="#292F36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M12 18V12" stroke="#292F36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M9 15L12 12L15 15" stroke="#292F36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <p>暂无已上传文件</p>
                    </div>
                `;
                return;
            }

            uploadedFiles.innerHTML = uploadedFilesList.map(file => `
                <div class="file-item">
                    <div class="file-info">
                        <div class="file-icon">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M14 2H6C4.9 2 4 2.9 4 4V20C4 21.1 4.9 22 6 22H18C19.1 22 20 21.1 20 20V8L14 2Z" fill="white"/>
                                <path d="M14 2V8H20" stroke="#4ECDC4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M16 13H8" stroke="#4ECDC4" stroke-width="2" stroke-linecap="round"/>
                                <path d="M16 17H8" stroke="#4ECDC4" stroke-width="2" stroke-linecap="round"/>
                                <path d="M10 9H8" stroke="#4ECDC4" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <div class="file-details">
                            <h4>${file.name}</h4>
                            <p>${formatFileSize(file.size)} · ${new Date(file.uploadTime).toLocaleDateString()}</p>
                        </div>
                    </div>
                    <div class="file-actions">
                        <button class="btn-small btn-copy" onclick="copyFileLink('${file.id}')">复制链接</button>
                        <button class="btn-small btn-delete" onclick="deleteFile('${file.id}')">删除</button>
                    </div>
                </div>
            `).join('');
        }

        // 复制文件链接
        function copyFileLink(fileId) {
            const link = `${window.location.origin}/download.html?id=${fileId}`;
            navigator.clipboard.writeText(link).then(() => {
                alert('链接已复制到剪贴板');
            });
        }

        // 删除文件
        function deleteFile(fileId) {
            if (confirm('确定要删除这个文件吗？')) {
                uploadedFilesList = uploadedFilesList.filter(f => f.id !== fileId);
                localStorage.setItem('uploadedFiles', JSON.stringify(uploadedFilesList));
                displayUploadedFiles();
            }
        }

        // 点击弹窗外部关闭
        linkModal.addEventListener('click', (e) => {
            if (e.target === linkModal) {
                linkModal.classList.remove('active');
            }
        });
    </script>
</body>
</html>
